name: Auto Aggregate TVBox Live Sources

on:
  schedule:
    - cron: '0 4 * * *' # 每天北京时间中午12点 (UTC 04:00) 自动聚合更新
  workflow_dispatch: # 支持手动一键触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Run Multi-Source Live Stream Aggregator
        run: |
          python3 update_live.py
          date -u > updated_at.txt

      - name: Commit and Push Updated Live Sources
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update TVBox live streams (multi-source IPv6/IPv4 aggregation)"
          file_pattern: "live.txt live.m3u updated_at.txt"
